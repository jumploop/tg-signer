[tox]
envlist = py311,py312

[testenv]
# 直接复用 pyproject 的 dev 依赖组:测试套件会 import fastapi / yaml 等可选能力的
# 依赖,手工维护一份 deps 清单必然再次漂移(此前 tox 环境缺 fastapi,收集阶段
# 直接 ModuleNotFoundError —— 这条跨版本验证路径实际是坏的,只有 CI 靠
# `pip install --group dev` 才没暴露)。
dependency_groups = dev
commands =
    pytest -W=ignore::DeprecationWarning:pyrogram.sync -vv tests/
