repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # 与 pyproject.toml 的 dev 依赖 ruff==0.14.6 保持一致，
    # 否则 pre-commit 与本地/CI 的 lint、格式化结果可能不同。
    rev: v0.14.6
    hooks:
      # Run the linter.
      - id: ruff
        args: [ --fix, --exit-non-zero-on-fix]
      # Run the formatter.
      - id: ruff-format

exclude: |
  (?x)^(
    docs
  )
